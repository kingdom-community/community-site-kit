name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18.x', '20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  og-card:
    # tools/og-card: the Strata-rendered link-preview card generator (Python, not
    # part of the npm package). Renders headless on Mesa llvmpipe, so the render
    # tests are required here rather than skipped.
    # Python 3.8 (the binding's floor) is no longer installable on the newest
    # ubuntu-latest image, so it runs on 22.04; 3.12 runs on the latest.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.8'
            os: ubuntu-22.04
          - python-version: '3.12'
            os: ubuntu-latest
    defaults:
      run:
        working-directory: tools/og-card
    env:
      OG_CARD_REQUIRE_RENDER: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
